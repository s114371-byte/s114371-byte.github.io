<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 Deluxe</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#faf8ef;
    text-align:center;
    margin:20px;
}

h1{
    color:#776e65;
}

#modeSelect{
    margin-bottom:15px;
}

#modeSelect button,
#restartBtn{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    background:#8f7a66;
    color:white;
}

#modeSelect button:hover,
#restartBtn:hover{
    opacity:0.9;
}

#score{
    font-size:24px;
    margin:15px;
    color:#776e65;
}

#board{
    margin:auto;
    background:#bbada0;
    padding:10px;
    gap:10px;
    border-radius:10px;
    display:grid;
}

.tile{
    border-radius:6px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:#776e65;
}
</style>
</head>

<body>

<h1>2048 Deluxe</h1>

<div id="modeSelect">
    <button onclick="startGame(3)">3×3 Hard</button>
    <button onclick="startGame(4)">4×4 Classic</button>
    <button onclick="startGame(5)">5×5 Easy</button>
    <button onclick="startGame(6)">6×6 Endless</button>
</div>

<div id="score">Score: 0</div>

<div id="board"></div>

<br>
<button id="restartBtn" onclick="startGame(SIZE)">
重新開始
</button>

<script>

let SIZE = 4;
let score = 0;
let board = [];

function startGame(size){

    SIZE = size;

    let boardPx = {
        3:330,
        4:420,
        5:520,
        6:620
    }[SIZE];

    const boardDiv = document.getElementById("board");

    boardDiv.style.width = boardPx + "px";
    boardDiv.style.height = boardPx + "px";
    boardDiv.style.gridTemplateColumns =
        `repeat(${SIZE},1fr)`;

    init();
}

function init(){

    board = Array(SIZE)
        .fill()
        .map(()=>Array(SIZE).fill(0));

    score = 0;

    addNumber();
    addNumber();

    draw();
}

function addNumber(){

    let empty = [];

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(board[r][c]===0){
                empty.push([r,c]);
            }
        }
    }

    if(empty.length===0) return;

    let [r,c] =
        empty[Math.floor(Math.random()*empty.length)];

    board[r][c] =
        Math.random()<0.9 ? 2 : 4;
}

function getColor(value){

    const colors = {
        0:"#cdc1b4",
        2:"#eee4da",
        4:"#ede0c8",
        8:"#f2b179",
        16:"#f59563",
        32:"#f67c5f",
        64:"#f65e3b",
        128:"#edcf72",
        256:"#edcc61",
        512:"#edc850",
        1024:"#edc53f",
        2048:"#edc22e"
    };

    return colors[value] || "#3c3a32";
}

function draw(){

    const boardDiv =
        document.getElementById("board");

    boardDiv.innerHTML = "";

    document.getElementById("score")
        .textContent = "Score: " + score;

    const tileSize =
        Math.floor((boardDiv.clientWidth -
        (SIZE+1)*10)/SIZE);

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){

            let tile =
                document.createElement("div");

            tile.className = "tile";

            tile.style.width =
                tileSize + "px";

            tile.style.height =
                tileSize + "px";

            tile.style.fontSize =
                Math.max(18,tileSize/3)+"px";

            tile.style.background =
                getColor(board[r][c]);

            tile.textContent =
                board[r][c]===0 ? "" : board[r][c];

            boardDiv.appendChild(tile);
        }
    }
}

function slide(row){

    row = row.filter(v=>v);

    for(let i=0;i<row.length-1;i++){

        if(row[i]===row[i+1]){

            row[i] *= 2;

            score += row[i];

            row[i+1] = 0;
        }
    }

    row = row.filter(v=>v);

    while(row.length<SIZE){
        row.push(0);
    }

    return row;
}

function moveLeft(){

    let old = JSON.stringify(board);

    for(let r=0;r<SIZE;r++){
        board[r] = slide(board[r]);
    }

    afterMove(old);
}

function moveRight(){

    let old = JSON.stringify(board);

    for(let r=0;r<SIZE;r++){

        board[r].reverse();

        board[r] = slide(board[r]);

        board[r].reverse();
    }

    afterMove(old);
}

function moveUp(){

    let old = JSON.stringify(board);

    for(let c=0;c<SIZE;c++){

        let col=[];

        for(let r=0;r<SIZE;r++){
            col.push(board[r][c]);
        }

        col = slide(col);

        for(let r=0;r<SIZE;r++){
            board[r][c]=col[r];
        }
    }

    afterMove(old);
}

function moveDown(){

    let old = JSON.stringify(board);

    for(let c=0;c<SIZE;c++){

        let col=[];

        for(let r=0;r<SIZE;r++){
            col.push(board[r][c]);
        }

        col.reverse();

        col = slide(col);

        col.reverse();

        for(let r=0;r<SIZE;r++){
            board[r][c]=col[r];
        }
    }

    afterMove(old);
}

function afterMove(old){

    if(old!==JSON.stringify(board)){

        addNumber();

        checkWin();

        draw();

        if(isGameOver()){
            setTimeout(()=>{
                alert("Game Over!");
            },100);
        }
    }
}

function checkWin(){

    for(let row of board){

        for(let value of row){

            if(value===2048){

                setTimeout(()=>{
                    alert("🎉 恭喜達成 2048！");
                },100);

                return;
            }
        }
    }
}

function isGameOver(){

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE;c++){

            if(board[r][c]===0)
                return false;

            if(c<SIZE-1 &&
               board[r][c]===board[r][c+1])
                return false;

            if(r<SIZE-1 &&
               board[r][c]===board[r+1][c])
                return false;
        }
    }

    return true;
}

document.addEventListener(
"keydown",
(e)=>{

    switch(e.key){

        case "ArrowLeft":
            moveLeft();
            break;

        case "ArrowRight":
            moveRight();
            break;

        case "ArrowUp":
            moveUp();
            break;

        case "ArrowDown":
            moveDown();
            break;
    }
});

startGame(4);

</script>

</body>
</html>
