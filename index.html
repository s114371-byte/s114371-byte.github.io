<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#faf8ef;
}

h1{
    color:#776e65;
}

#score{
    font-size:24px;
    margin-bottom:15px;
}

#board{
    width:420px;
    height:420px;
    margin:auto;
    background:#bbada0;
    border-radius:10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.tile{
    width:90px;
    height:90px;
    border-radius:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
    background:#cdc1b4;
    color:#776e65;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>2048</h1>
<div id="score">Score: 0</div>
<div id="board"></div>
<button onclick="restart()">重新開始</button>

<script>
const SIZE = 4;
let score = 0;
let board = [];

function init(){
    board = Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
    score = 0;
    addNumber();
    addNumber();
    draw();
}

function addNumber(){
    let empty=[];

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(board[r][c]===0){
                empty.push([r,c]);
            }
        }
    }

    if(empty.length===0) return;

    let [r,c] = empty[Math.floor(Math.random()*empty.length)];
    board[r][c] = Math.random()<0.9 ? 2 : 4;
}

function getColor(value){
    const colors={
        0:"#cdc1b4",
        2:"#eee4da",
        4:"#ede0c8",
        8:"#f2b179",
        16:"#f59563",
        32:"#f67c5f",
        64:"#f65e3b",
        128:"#edcf72",
        256:"#edcc61",
        512:"#edc850",
        1024:"#edc53f",
        2048:"#edc22e"
    };
    return colors[value] || "#3c3a32";
}

function draw(){
    const boardDiv=document.getElementById("board");
    boardDiv.innerHTML="";

    document.getElementById("score").textContent =
        "Score: " + score;

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            let tile=document.createElement("div");

            tile.className="tile";
            tile.style.background=getColor(board[r][c]);

            if(board[r][c]!==0){
                tile.textContent=board[r][c];
            }

            boardDiv.appendChild(tile);
        }
    }
}

function slide(row){
    row=row.filter(v=>v);

    for(let i=0;i<row.length-1;i++){
        if(row[i]===row[i+1]){
            row[i]*=2;
            score+=row[i];
            row[i+1]=0;
        }
    }

    row=row.filter(v=>v);

    while(row.length<SIZE){
        row.push(0);
    }

    return row;
}

function moveLeft(){
    let old=JSON.stringify(board);

    for(let r=0;r<SIZE;r++){
        board[r]=slide(board[r]);
    }

    if(old!==JSON.stringify(board)){
        addNumber();
    }

    draw();
}

function moveRight(){
    let old=JSON.stringify(board);

    for(let r=0;r<SIZE;r++){
        board[r].reverse();
        board[r]=slide(board[r]);
        board[r].reverse();
    }

    if(old!==JSON.stringify(board)){
        addNumber();
    }

    draw();
}

function moveUp(){
    let old=JSON.stringify(board);

    for(let c=0;c<SIZE;c++){
        let col=[];

        for(let r=0;r<SIZE;r++){
            col.push(board[r][c]);
        }

        col=slide(col);

        for(let r=0;r<SIZE;r++){
            board[r][c]=col[r];
        }
    }

    if(old!==JSON.stringify(board)){
        addNumber();
    }

    draw();
}

function moveDown(){
    let old=JSON.stringify(board);

    for(let c=0;c<SIZE;c++){
        let col=[];

        for(let r=0;r<SIZE;r++){
            col.push(board[r][c]);
        }

        col.reverse();
        col=slide(col);
        col.reverse();

        for(let r=0;r<SIZE;r++){
            board[r][c]=col[r];
        }
    }

    if(old!==JSON.stringify(board)){
        addNumber();
    }

    draw();
}

document.addEventListener("keydown",(e)=>{
    switch(e.key){
        case "ArrowLeft":
            moveLeft();
            break;
        case "ArrowRight":
            moveRight();
            break;
        case "ArrowUp":
            moveUp();
            break;
        case "ArrowDown":
            moveDown();
            break;
    }
});

function restart(){
    init();
}

init();
</script>

</body>
</html>
